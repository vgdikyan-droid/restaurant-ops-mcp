name: tiktok-categorizer

on:
  push:
    paths:
      - "tiktok-categorizer/**"
      - ".github/workflows/tiktok-categorizer.yml"
  pull_request:
    paths:
      - "tiktok-categorizer/**"
      - ".github/workflows/tiktok-categorizer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: tiktok-categorizer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install app, test dependencies and Chromium
        run: |
          python -m pip install -e ".[ai,dev]"
          python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          TIKTOK_REQUIRE_BROWSER_TESTS: "1"
        run: pytest -q
