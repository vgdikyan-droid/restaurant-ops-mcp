name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        sdk: ["mcp[cli]>=2.0,<3.0"]
        include:
          - python-version: "3.10"
            sdk: "mcp[cli]==2.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" "${{ matrix.sdk }}"

      - name: Run tests
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel without the source import path
        run: |
          python -m pip install dist/*.whl "pytest>=8,<9"
          python -m pytest -q -o pythonpath=
          python -m pip check
