[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-ops-mcp"
version = "0.1.0"
description = "Open-source MCP tools for restaurant menu and operating analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "vgdikyan-droid" }
]
dependencies = [
  "mcp[cli]>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
